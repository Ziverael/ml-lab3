# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.9
target-version = "py313"

[lint]
# Enable comprehensive linting rules for PEP compliance
select = [
    "F", # Pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort (import sorting - PEP 8)
    "D", # pydocstyle (docstring conventions - PEP 257)
    "ANN", # flake8-annotations (type annotations - PEP 484)
    "B", # flake8-bugbear (additional bug and design problems)
]
ignore = [
    "D104", # Allow missing docstrings in public packages (__init__.py files)
    "D105", # Allow missing docstrings for magic methods
    "D107", # Allow missing docstrings for __init__ methods
    "D200", # Allow one-line docstring should fit on one line
    "ANN101", # Allow missing type annotation for self in methods
    "ANN102" # Allow missing type annotation for cls in classmethods
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[lint.pydocstyle]
# Configure docstring conventions (PEP 257 compliance)
convention = "pep257"

[lint.flake8-annotations]
# Configure type annotation requirements (PEP 484 compliance)
allow-star-arg-any = false
ignore-fully-untyped = false
suppress-dummy-args = true
suppress-none-returning = true
